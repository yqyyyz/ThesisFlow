<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>人工审核｜测评优化人工协作工作台</title>
    <link rel="stylesheet" href="/static/base.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="brand">
        <div class="brand-mark">评</div>
        <div><div class="brand-title">测评优化人工协作工作台</div><div class="brand-subtitle">独立于 ThesisFlow 运行 · 只记录审核反馈</div></div>
      </div>
      <nav class="top-nav"><a href="/">任务现状</a><a class="active" href="/review">人工审核</a></nav>
    </header>
    <main class="page">
      <div class="eyebrow">HUMAN REVIEW</div>
      <h1>按页面提示完成审核</h1>
      <p class="lead">当前模型输出会自动出现在这里。你只需要对照原文或参考标准作出判断并保存，不需要在两个产品之间复制粘贴。</p>
      <section class="review-layout">
        <aside class="review-rail">
          <h2 class="rail-title">选择要审核的工作</h2>
          <select id="task-select"><option>正在加载…</option></select>
          <div id="availability"></div>
          <ol class="step-list">
            <li><span class="step-dot">1</span><span>直接阅读工作台自动载入的当前模型输出。</span></li>
            <li><span class="step-dot">2</span><span>对照原文或参考标准，点击每一项判断。</span></li>
            <li><span class="step-dot">3</span><span>写下必须修改的问题，点击“保存到本地”。</span></li>
          </ol>
          <a id="status-link" class="secondary-link" style="width:100%;margin-top:16px" href="/">查看该项完整状态</a>
        </aside>
        <article class="review-main" id="review-main"><div class="empty">正在准备审核页面…</div></article>
      </section>
    </main>
    <script type="module" src="/static/review.js"></script>
  </body>
</html>
